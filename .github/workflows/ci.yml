name: MAYSTROON CI
on:
  push:
    branches:
      [
        main,
        stage-1-foundation,
        stage-2-advanced-cms,
        stage-3-admin-security-control-center,
        stage-4-telegram-ai-automation,
        stage-5-production-readiness,
      ]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run test:release
      - run: npm run build
      - run: npm run security:client
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:cms
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/telegram-bot/requirements-dev.lock
      - run: python -m pip install -r services/telegram-bot/requirements-dev.lock
      - run: python -m ruff check services/telegram-bot
      - run: python -m ruff format --check services/telegram-bot
      - run: PYTHONPATH=services/telegram-bot python -m unittest discover -s services/telegram-bot/tests -v
